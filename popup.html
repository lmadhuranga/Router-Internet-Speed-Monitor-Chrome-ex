<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Router Monitor</title>

  <link rel="stylesheet" href="popup.css" />
</head>

<body>

  <div class="popup">

    <!-- Header -->
    <div class="header">
      <div class="title">
        Router Monitor
      </div>

      <div id="statusDot" class="status-dot connecting"></div>
    </div>


    <!-- Signal -->
    <div class="signal-section">

      <div id="signalValue" class="signal-value">
        -- dBm
      </div>

      <div class="signal-label">
        Signal
      </div>

    </div>


    <!-- Speed -->
    <div class="speed-container">

      <!-- Upload -->
      <div class="speed-card">

        <div class="speed-icon upload">
          ↑
        </div>

        <div class="speed-info">

          <div id="uploadSpeed" class="speed-value">
            0 KB
          </div>

          <div class="speed-label">
            Upload
          </div>

        </div>

      </div>


      <!-- Download -->
      <div class="speed-card">

        <div class="speed-icon download">
          ↓
        </div>

        <div class="speed-info">

          <div id="downloadSpeed" class="speed-value">
            0 KB
          </div>

          <div class="speed-label">
            Download
          </div>

        </div>

      </div>

    </div>


    <!-- Wi-Fi -->
    <div class="wifi-section">

      <div class="wifi-header">

        <span class="wifi-title">
          Wi-Fi Visibility
        </span>

        <span id="wifiStatus" class="wifi-status">
          Checking...
        </span>

      </div>


      <div class="wifi-controls">

        <button
          id="wifiToggleBtn"
          class="wifi-toggle"
          type="button"
        >
          Checking...
        </button>

      </div>

    </div>


    <!-- Refresh Controls -->
    <div class="refresh-section">

      <button
        id="refreshBtn"
        class="refresh-btn"
        type="button"
      >
        Refresh
      </button>

      <button
        id="refresh500Btn"
        class="interval-btn"
        type="button"
      >
        500ms
      </button>

      <button
        id="refresh1000Btn"
        class="interval-btn active"
        type="button"
      >
        1000ms
      </button>

    </div>


    <!-- Router Status -->
    <div
      id="errorMessage"
      class="error-message hidden"
    ></div>

  </div>


  <script src="popup.js"></script>

</body>
</html>
